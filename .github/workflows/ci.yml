name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése (Checkout)
      uses: actions/checkout@v3

    - name: .NET környezet beállítása
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Linter ellenőrzés (Format check)
      run: |
        dotnet format WebApi/WebApi.csproj --verify-no-changes
        dotnet format WebApi.Tests/WebApi.Tests.csproj --verify-no-changes

    - name: Függőségek telepítése (Restore)
      run: dotnet restore WebApi.Tests/WebApi.Tests.csproj

    - name: Kód fordítása (Build)
      run: dotnet build WebApi.Tests/WebApi.Tests.csproj --no-restore

    - name: Tesztek futtatása (Test)
      run: dotnet test WebApi.Tests/WebApi.Tests.csproj --no-build --verbosity normal