name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése (Checkout)
      uses: actions/checkout@v3

    - name: .NET környezet beállítása
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # Írd át 7.0.x-re, ha azt használtok

    - name: Függőségek telepítése (Restore)
      run: dotnet restore

    - name: Kód fordítása (Build)
      run: dotnet build --no-restore

    - name: Tesztek futtatása (Test)
      run: dotnet test WebApi.Tests/WebApi.Tests.csproj